<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icon-256.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Screen-Clean</title>
    <script>
      // Erscheinungsbild vor dem ersten Zeichnen setzen – kein Aufblitzen
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="requests"></div>
    <div id="modals"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
