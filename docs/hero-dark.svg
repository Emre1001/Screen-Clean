<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Screen-Clean – Zuschau-Ansicht mit farbigen Live-Cursorn, Chat und Steuerung</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f2b"/><stop offset="1" stop-color="#0d0e13"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0" r="0.8"><stop offset="0" stop-color="#2a2d45" stop-opacity=".9"/><stop offset="1" stop-color="#2a2d45" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".6"/></filter>
    <filter id="win" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="cs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".45"/></filter>
    <clipPath id="stage"><path d="M60 88 H1140 V642 A18 18 0 0 1 1122 660 H78 A18 18 0 0 1 60 642 Z"/></clipPath>
    <path id="arrow" d="M0 0 L0 22 L5.8 16.6 L9.6 25.6 L13.8 23.8 L10 15 L18.5 15 Z"/>
  </defs>

  <rect width="1200" height="700" fill="#0e0e10"/>

  <!-- Fenster -->
  <g filter="url(#shadow)"><rect x="60" y="50" width="1080" height="610" rx="18" fill="#18181b"/></g>
  <rect x="60.5" y="50.5" width="1079" height="609" rx="17.5" fill="none" stroke="#ffffff17"/>
  <circle cx="84" cy="69" r="5.5" fill="#ffffff24"/><circle cx="102" cy="69" r="5.5" fill="#ffffff24"/><circle cx="120" cy="69" r="5.5" fill="#ffffff24"/>
  <text x="600" y="73.5" fill="#a1a1aa" font-size="12.5" font-weight="550" text-anchor="middle">Screen-Clean</text>

  <g clip-path="url(#stage)">
    <rect x="60" y="88" width="1080" height="572" fill="url(#desk)"/>
    <rect x="60" y="88" width="1080" height="572" fill="url(#glow)"/>

    <!-- Code-Fenster -->
    <g filter="url(#win)"><rect x="130" y="160" width="500" height="250" rx="12" fill="#16171f"/></g>
    <rect x="130.5" y="160.5" width="499" height="249" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
    <circle cx="146" cy="176" r="4.5" fill="#fff" fill-opacity=".12"/>
    <text x="158" y="180" fill="#8b8d98" font-size="12">share.rs</text>
    <line x1="130" y1="192" x2="630" y2="192" stroke="#fff" stroke-opacity=".06"/>
    <g font-family="'Geist Mono', 'SF Mono', Consolas, monospace" font-size="13.5" fill="#d4d4d8">
      <text x="150" y="226"><tspan fill="#b4a3f5">fn</tspan> <tspan fill="#7cc7f2">share</tspan>(screen: &amp;Screen) {</text>
      <text x="178" y="252"><tspan fill="#b4a3f5">let</tspan> peers = p2p::connect(<tspan fill="#8fd4a6">"K7P-29Q"</tspan>);</text>
      <text x="178" y="278">peers.stream(screen, Fps(120));</text>
      <text x="178" y="304" fill="#6b6e7a">// direkt, ohne Umweg</text>
      <text x="178" y="330">cursors.<tspan fill="#7cc7f2">show_all</tspan>();</text>
      <text x="150" y="356">}</text>
    </g>
    <rect x="178" y="239" width="0" height="18" rx="3" fill="#e5484d" fill-opacity=".22">
      <animate attributeName="width" values="0;0;250;250;0" keyTimes="0;.3;.45;.85;1" dur="10s" repeatCount="indefinite"/>
    </rect>

    <!-- Diagramm-Fenster -->
    <g filter="url(#win)"><rect x="560" y="330" width="320" height="230" rx="12" fill="#16171f"/></g>
    <rect x="560.5" y="330.5" width="319" height="229" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".07"/>
    <circle cx="576" cy="346" r="4.5" fill="#fff" fill-opacity=".12"/>
    <text x="588" y="350" fill="#8b8d98" font-size="12">Besucher · Woche</text>
    <line x1="560" y1="362" x2="880" y2="362" stroke="#fff" stroke-opacity=".06"/>
    <g fill="#2b2e3d">
      <rect x="580" y="430" width="30" height="70" rx="4"><animate attributeName="height" values="70;40;70" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="430;460;430" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="620" y="400" width="30" height="100" rx="4"/>
      <rect x="660" y="445" width="30" height="55" rx="4"><animate attributeName="height" values="55;85;55" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="445;415;445" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="700" y="420" width="30" height="80" rx="4"/>
      <rect x="740" y="390" width="30" height="110" rx="4" fill="#5b86ff"/>
      <rect x="780" y="435" width="30" height="65" rx="4"/>
      <rect x="820" y="405" width="30" height="95" rx="4"><animate attributeName="height" values="95;60;95" dur="7s" repeatCount="indefinite"/><animate attributeName="y" values="405;440;405" dur="7s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="580" y="514" width="118" height="30" rx="8" fill="#f4f4f5"/>
    <text x="639" y="533.5" fill="#111113" font-size="12.5" font-weight="600" text-anchor="middle">Veröffentlichen</text>
    <circle cx="640" cy="529" r="0" fill="none" stroke="#12a594" stroke-width="2">
      <animate attributeName="r" values="0;0;28" keyTimes="0;.66;.76" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.66;.67;.78" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Host-Chip -->
    <rect x="74" y="102" width="150" height="44" rx="14" fill="#18181b" fill-opacity=".72" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="96" cy="124" r="13" fill="#3e63dd" fill-opacity=".28"/>
    <text x="96" y="128" fill="#9db1f5" font-size="11" font-weight="650" text-anchor="middle">E</text>
    <text x="118" y="121" fill="#f4f4f5" font-size="13" font-weight="600">Emre</text>
    <text x="118" y="137" fill="#a1a1aa" font-size="11">120 FPS · 9 ms</text>

    <!-- Chat-Panel -->
    <rect x="886" y="158" width="240" height="402" rx="18" fill="#18181b" fill-opacity=".74" stroke="#fff" stroke-opacity=".08"/>
    <text x="904" y="188" fill="#f4f4f5" font-size="13" font-weight="600">Chat</text>
    <line x1="886" y1="204" x2="1126" y2="204" stroke="#fff" stroke-opacity=".08"/>
    <g>
      <circle cx="914" cy="232" r="12" fill="#e5484d" fill-opacity=".25"/><text x="914" y="236" fill="#f4a9ab" font-size="10" font-weight="650" text-anchor="middle">L</text>
      <text x="934" y="229" fill="#f08b8e" font-size="11.5" font-weight="600">Lisa</text>
      <text x="934" y="246" fill="#e4e4e7" font-size="12.5">Seht ihr meinen Cursor?</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.2;.24;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="914" cy="280" r="12" fill="#12a594" fill-opacity=".25"/><text x="914" y="284" fill="#7fd6cc" font-size="10" font-weight="650" text-anchor="middle">M</text>
      <text x="934" y="277" fill="#5fcbbf" font-size="11.5" font-weight="600">Max</text>
      <text x="934" y="294" fill="#e4e4e7" font-size="12.5">Ja, in Rot 😄</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.55;.59;1" dur="10s" repeatCount="indefinite"/>
      <circle cx="914" cy="328" r="12" fill="#8e4ec6" fill-opacity=".28"/><text x="914" y="332" fill="#c9a7e8" font-size="10" font-weight="650" text-anchor="middle">A</text>
      <text x="934" y="325" fill="#b892e0" font-size="11.5" font-weight="600">Aylin</text>
      <text x="934" y="342" fill="#e4e4e7" font-size="12.5">Klick mal auf Veröffentlichen</text>
    </g>
    <rect x="898" y="512" width="180" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1"/>
    <text x="912" y="533" fill="#71717a" font-size="12.5">Nachricht</text>
    <circle cx="1101" cy="529" r="17" fill="#5b86ff"/>
    <path d="M1094 529 h13 m-5 -5 l5 5 l-5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dock -->
    <rect x="452" y="596" width="296" height="50" rx="17" fill="#18181b" fill-opacity=".74" stroke="#fff" stroke-opacity=".08"/>
    <rect x="458" y="602" width="94" height="38" rx="12" fill="#f0b443"/>
    <text x="505" y="625.5" fill="#1c1405" font-size="13" font-weight="600" text-anchor="middle">Abgeben</text>
    <line x1="560" y1="610" x2="560" y2="632" stroke="#fff" stroke-opacity=".12"/>
    <g fill="none" stroke="#d4d4d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="568" y="602" width="38" height="38" rx="12" fill="#fff" fill-opacity=".12" stroke="none"/>
      <path d="M580 627 l1.5-4 a8 8 0 1 1 3 3 z"/>
      <circle cx="623" cy="617" r="3.5"/><path d="M616 628 a7 7 0 0 1 14 0"/>
      <path d="M654 621 h4 l3-7 l4 13 l3-6 h4"/>
      <path d="M696 614 h-4 v4 M708 614 h4 v4 M696 628 h-4 v-4 M708 628 h4 v-4"/>
      <path d="M731 613 h-5 v16 h5 M733 621 h8 m-3 -3 l3 3 l-3 3"/>
    </g>
    <line x1="720" y1="610" x2="720" y2="632" stroke="#fff" stroke-opacity=".12"/>

    <!-- Cursor: Lisa steuert -->
    <g filter="url(#cs)">
      <animateMotion dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.3;.45;.62;.8;1" keyPoints="0;.25;.45;.62;.8;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"
        path="M420 470 C360 380 200 280 178 246 S330 250 428 248 S600 420 640 528 S520 520 420 470"/>
      <use href="#arrow" fill="#e5484d" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <rect x="15" y="20" width="58" height="22" rx="7" fill="#e5484d"/>
      <circle cx="25" cy="31" r="3" fill="#fff"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="33" y="35.5" fill="#fff" font-size="11.5" font-weight="600">Lisa</text>
    </g>
    <!-- Cursor: Max -->
    <g filter="url(#cs)">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keyPoints="0;.5;1" keySplines=".45 0 .25 1;.45 0 .25 1"
        path="M760 470 C820 400 760 330 700 300 S560 420 600 480 S720 520 760 470"/>
      <use href="#arrow" fill="#12a594" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <rect x="15" y="20" width="42" height="22" rx="7" fill="#12a594"/>
      <text x="36" y="35.5" fill="#fff" font-size="11.5" font-weight="600" text-anchor="middle">Max</text>
    </g>
    <!-- Cursor: Aylin -->
    <g filter="url(#cs)">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keyPoints="0;.5;1" keySplines=".45 0 .25 1;.45 0 .25 1"
        path="M260 500 C200 450 320 420 380 440 S460 540 360 540 S300 560 260 500"/>
      <use href="#arrow" fill="#8e4ec6" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      <rect x="15" y="20" width="50" height="22" rx="7" fill="#8e4ec6"/>
      <text x="40" y="35.5" fill="#fff" font-size="11.5" font-weight="600" text-anchor="middle">Aylin</text>
    </g>

    <!-- Reaktion -->
    <text x="660" y="560" font-size="30" opacity="0">🔥
      <animate attributeName="y" values="560;560;400" keyTimes="0;.74;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.74;.78;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <path d="M61 89 H1139 V642 A17 17 0 0 1 1122 659 H78 A17 17 0 0 1 61 642 Z" fill="none" stroke="#f0b443" stroke-opacity=".7" stroke-width="2"/>
</svg>
